[project]
name = "pyjvcprojector"
description = "A python client library for controlling a JVC Projector over a network connection."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Steve Easley", email = "tardis74@yahoo.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
urls = { "Homepage" = "https://github.com/SteveEasley/pyjvcprojector" }
dynamic = ["version"]

dependencies = []

# Dev tools are pinned to the versions Home Assistant uses; bump them together.
[dependency-groups]
dev = [
    "mypy==2.4.0",
    "prek==0.5.4",
    "pylint==4.1.2",
    "pytest-asyncio==1.4.0",
    "pytest==9.0.3",
    "ruff==0.16.10",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jvcprojector", "jvcprojector.command"]

[tool.setuptools.package-data]
jvcprojector = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "jvcprojector.__version__" }

[tool.pytest.ini_options]
log_level = "DEBUG"
testpaths = "tests"
norecursedirs = ".git"
filterwarnings = [
    "ignore:.*loop argument is deprecated:DeprecationWarning"
]

[tool.ruff]
required-version = ">=0.16.10"
exclude = ["examples"]


[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F405", "E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.mypy]
disable_error_code = "annotation-unchecked"

[tool.pylint]
disable = [
    "duplicate-code",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-statements",
]

[project.scripts]
jvcprojector = "jvcprojector.cli:cli_entrypoint"
