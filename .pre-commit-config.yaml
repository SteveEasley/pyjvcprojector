repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^uv\.lock$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args:
          - --pedantic
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --locked mypy jvcprojector tests
        language: system
        pass_filenames: false
        require_serial: true
        types_or: [python, pyi]
      - id: pylint
        name: pylint
        entry: uv run --locked pylint jvcprojector tests
        language: system
        pass_filenames: false
        require_serial: true
        types_or: [python, pyi]
